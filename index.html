  <script type="module">
    // =========================================================================

    // =========================================================================
    // 1. WEB AUDIO API SES MOTORU (Harici ses dosyası gerektirmez)
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.muted = false;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        const icon = document.getElementById('mute-icon');
        if (icon) {
          icon.setAttribute('data-lucide', this.muted ? 'volume-x' : 'volume-2');
          lucide.createIcons();
        }
        showToast(this.muted ? 'Ses efektleri kapatıldı' : 'Ses efektleri açıldı', 'info');
      }
      playTone(freq, type = 'sine', duration = 0.15, vol = 0.15, delay = 0) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch (e) {}
      }
      tick(urgent = false) {
        this.playTone(urgent ? 880 : 520, 'triangle', 0.08, urgent ? 0.2 : 0.1);
      }
      click() {
        this.playTone(600, 'sine', 0.07, 0.15);
      }
      correct() {
        this.playTone(523.25, 'triangle', 0.15, 0.2, 0);
        this.playTone(659.25, 'triangle', 0.15, 0.2, 0.1);
        this.playTone(783.99, 'triangle', 0.3, 0.25, 0.2);
      }
      wrong() {
        this.playTone(220, 'sawtooth', 0.25, 0.18, 0);
        this.playTone(185, 'sawtooth', 0.35, 0.18, 0.18);
      }
      fanfare() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          this.playTone(f, 'triangle', 0.25, 0.2, i * 0.12);
        });
      }
    }
    window.soundEngine = new SoundEngine();

    // =========================================================================
    // 2. TOAST BİLDİRİM SİSTEMİ
    // =========================================================================
    window.showToast = (message, type = 'info') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        info: 'bg-slate-800/95 border-indigo-500/50 text-white',
        success: 'bg-emerald-950/95 border-emerald-500/60 text-emerald-100',
        error: 'bg-rose-950/95 border-rose-500/60 text-rose-100',
        warning: 'bg-amber-950/95 border-amber-500/60 text-amber-100'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-2xl backdrop-blur-md text-sm font-medium flex items-center justify-between gap-3 animate-pop ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 250);
      }, 3200);
    };

    // =========================================================================
    // 4. GERÇEK ZAMANLI VERİTABANI & ÇOKLU SEKME SENKRONİZASYON MOTORU
    // =========================================================================
    class RealtimeBackend {
      constructor() {
        this.db = null;
        this.auth = null;
        this.user = null;
        this.appId = typeof __app_id !== 'undefined' ? __app_id : 'quiz-arena-default';
        this.useCloud = false;
        // BroadcastChannel ile aynı tarayıcıdaki farklı sekmeler arasında sıfır gecikmeli senkronizasyon
        this.channel = new BroadcastChannel('quiz_arena_realtime_bus');
        this.localRooms = new Map();
        this.localPlayers = new Map();
        this.listeners = [];
        this.loadFromLocalCache();
      }

      loadFromLocalCache() {
        try {
          // sessionStorage yerine localStorage kullanıyoruz, böylece yeni sekmelerde PIN anında tanınır
          const cachedRooms = JSON.parse(localStorage.getItem('qa_rooms') || '{}');
          Object.entries(cachedRooms).forEach(([k, v]) => this.localRooms.set(k, v));
          const cachedPlayers = JSON.parse(localStorage.getItem('qa_players') || '{}');
          Object.entries(cachedPlayers).forEach(([k, v]) => this.localPlayers.set(k, v));
        } catch (e) {}
      }

      persistToLocalCache() {
        try {
          localStorage.setItem('qa_rooms', JSON.stringify(Object.fromEntries(this.localRooms)));
          localStorage.setItem('qa_players', JSON.stringify(Object.fromEntries(this.localPlayers)));
        } catch (e) {}
      }

      async init() {
        try {
          let config = null;
          
          // 1. Otomatik platform yapılandırması (Buradaki önizleme için)
          if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
          } 
          // 2. Manuel veritabanı yapılandırması (Kendi sitenizde çalıştırmak için)
          else if (CUSTOM_FIREBASE_CONFIG && CUSTOM_FIREBASE_CONFIG.apiKey) {
            config = CUSTOM_FIREBASE_CONFIG;
          }

          if (config) {
            const fbApp = initializeApp(config);
            this.auth = getAuth(fbApp);
            this.db = getFirestore(fbApp);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(this.auth, __initial_auth_token);
            } else {
              await signInAnonymously(this.auth);
            }
            this.user = this.auth.currentUser;
            if (this.user) {
              this.useCloud = true;
            }
          }
        } catch (err) {
          console.warn("Bulut bağlantısı kurulamadı, yerel gerçek zamanlı motor aktif:", err);
          this.useCloud = false;
        }

        // BroadcastChannel dinleyicisi (sekmeler arası anlık veri aktarımı)
        this.channel.onmessage = (event) => {
          const { type, payload } = event.data;
          if (type === 'SYNC_ROOM') {
            this.localRooms.set(payload.pin, payload);
            this.persistToLocalCache();
            this.notifyListeners('room', payload.pin, payload);
          } else if (type === 'SYNC_PLAYER') {
            this.localPlayers.set(payload.docId, payload);
            this.persistToLocalCache();
            this.notifyListeners('players', payload.roomPin);
          } else if (type === 'REQUEST_STATE') {
            // Yeni açılan sekme mevcut oda durumunu istiyorsa gönder
            const room = this.localRooms.get(payload.pin);
            if (room) {
              this.channel.postMessage({ type: 'SYNC_ROOM', payload: room });
              this.localPlayers.forEach((p) => {
                if (p.roomPin === payload.pin) {
                  this.channel.postMessage({ type: 'SYNC_PLAYER', payload: p });
                }
              });
            }
          }
        };

        const syncText = document.getElementById('sync-text');
        const syncBadge = document.getElementById('sync-badge');
        const syncDot = document.getElementById('sync-dot');
        
        if (syncText && syncBadge && syncDot) {
          if (this.useCloud) {
            syncText.textContent = 'İnternet Bağlantısı Aktif (Online)';
            syncBadge.className = 'flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30';
            syncDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-ping';
          } else {
            syncText.textContent = 'Yerel Mod (İnternet Ayarı Gerekli)';
            syncBadge.className = 'flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30';
            syncDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
          }
        }
      }

      notifyListeners(kind, pin, data = null) {
        this.listeners.forEach(fn => fn(kind, pin, data));
      }

      onUpdate(fn) {
        this.listeners.push(fn);
        return () => {
          this.listeners = this.listeners.filter(l => l !== fn);
        };
      }

      // Oda Oluşturma / Güncelleme
      async saveRoom(roomData) {
        this.localRooms.set(roomData.pin, roomData);
        this.persistToLocalCache();
        this.channel.postMessage({ type: 'SYNC_ROOM', payload: roomData });
        this.notifyListeners('room', roomData.pin, roomData);

        if (this.useCloud && this.user) {
          try {
            const roomRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'quiz_rooms', `room_${roomData.pin}`);
            await setDoc(roomRef, roomData);
          } catch (e) {
            console.error("Oda kaydetme hatası:", e);
          }
        }
      }

      // Oda Getirme (Bulut + Çoklu Sekme Sorgusu)
      async getRoom(pin) {
        // 1. Önce yerel belleğe bak
        if (this.localRooms.has(pin)) return this.localRooms.get(pin);

        // 2. Bulut veritabanından kontrol et
        if (this.useCloud && this.user) {
          try {
            const roomRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'quiz_rooms', `room_${pin}`);
            const snap = await getDoc(roomRef);
            if (snap.exists()) {
              const data = snap.data();
              this.localRooms.set(pin, data);
              this.persistToLocalCache();
              return data;
            }
          } catch (e) {
            console.error("Oda okuma hatası:", e);
          }
        }

        // 3. Diğer açık sekmelere yayın yap ve yanıt bekle
        this.channel.postMessage({ type: 'REQUEST_STATE', payload: { pin } });
        for (let i = 0; i < 6; i++) {
          await new Promise(r => setTimeout(r, 100));
          if (this.localRooms.has(pin)) return this.localRooms.get(pin);
        }
        return null;
      }

      // Oyuncu Ekleme / Güncelleme
      async savePlayer(playerData) {
        const cleanNick = playerData.nickname.trim().toLowerCase().replace(/[^a-z0-9ğüşıöç_]/gi, '_');
        const docId = `${playerData.roomPin}_${cleanNick}`;
        const fullData = { ...playerData, docId, lastSeen: Date.now() };

        this.localPlayers.set(docId, fullData);
        this.persistToLocalCache();
        this.channel.postMessage({ type: 'SYNC_PLAYER', payload: fullData });
        this.notifyListeners('players', playerData.roomPin);

        if (this.useCloud && this.user) {
          try {
            const playerRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'quiz_players', docId);
            await setDoc(playerRef, fullData);
          } catch (e) {
            console.error("Oyuncu kaydetme hatası:", e);
          }
        }
        return fullData;
      }

      // Oyuncu Getirme (Yeniden bağlanma kontrolü için)
      async getPlayer(pin, nickname) {
        const cleanNick = nickname.trim().toLowerCase().replace(/[^a-z0-9ğüşıöç_]/gi, '_');
        const docId = `${pin}_${cleanNick}`;
        if (this.localPlayers.has(docId)) return this.localPlayers.get(docId);

        if (this.useCloud && this.user) {
          try {
            const playerRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'quiz_players', docId);
            const snap = await getDoc(playerRef);
            if (snap.exists()) {
              const data = snap.data();
              this.localPlayers.set(docId, data);
              return data;
            }
          } catch (e) {}
        }
        return null;
      }

      // Odaya Ait Tüm Oyuncuları Getir
      getPlayersForRoom(pin) {
        const list = [];
        this.localPlayers.forEach(p => {
          if (p.roomPin === pin) list.push(p);
        });
        return list.sort((a, b) => b.score - a.score);
      }

      // Firestore Gerçek Zamanlı Dinleyici Başlat
      subscribeToRoom(pin) {
        if (!this.useCloud || !this.user) return () => {};

        const roomRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'quiz_rooms', `room_${pin}`);
        const unsubRoom = onSnapshot(roomRef, (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            this.localRooms.set(pin, data);
            this.notifyListeners('room', pin, data);
          }
        }, (err) => console.error("Oda dinleme hatası:", err));

        const playersCol = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'quiz_players');
        const unsubPlayers = onSnapshot(playersCol, (snapshot) => {
          snapshot.forEach((docSnap) => {
            const p = docSnap.data();
            if (p.roomPin === pin) {
              this.localPlayers.set(p.docId, p);
            }
          });
          this.notifyListeners('players', pin);
        }, (err) => console.error("Oyuncu dinleme hatası:", err));

        return () => {
          unsubRoom();
          unsubPlayers();
        };
      }
    }

    const backend = new RealtimeBackend();

    // =========================================================================
    // 5. ANA UYGULAMA KONTROLCÜSÜ (STATE & UI)
    // =========================================================================
    class QuizApp {
      constructor() {
        this.role = null; // 'HOST' | 'PLAYER'
        this.pin = null;
        this.room = null;
        this.questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
        this.editingQuestionIdx = null;
        this.player = null;
        this.showOptionsOnPhone = true;
        this.timerInterval = null;
        this.unsubCloud = null;
        this.lastTickSecond = null;
        this.prefillPin = '';

        // URL'de ?pin=XXXXXX veya #pin=XXXXXX varsa otomatik katılımcı ekranını aç
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
          const urlPin = urlParams.get('pin') || hashParams.get('pin');
          if (urlPin && /^\d{6}$/.test(urlPin)) {
            this.role = 'PLAYER';
            this.prefillPin = urlPin;
          }
        } catch (e) {}
      }

      // Geçerli ve paylaşılabilir katılım URL'si üretir (srcdoc / iframe korumalı)
      getJoinUrl() {
        let href = window.location.href.split('?')[0].split('#')[0];
        // Sandbox, iframe veya blob içindeyse varsayılan bir URL üret (Gerçek sunucuya yüklenince otomatik kendi adresiniz olur)
        if (!href || href.startsWith('about:') || href.startsWith('blob:') || href.startsWith('data:')) {
          href = 'https://quizarena.online'; 
        }
        return `${href}?pin=${this.pin}`;
      }

      // Lobi ekranından doğrudan yeni sekmede oyuncu simülasyonu açma
      openTestPlayerTab() {
        soundEngine.click();
        const href = window.location.href;
        if (href && !href.startsWith('about:') && !href.startsWith('blob:')) {
          const url = new URL(href);
          url.searchParams.set('pin', this.pin);
          window.open(url.toString(), '_blank');
        } else {
          // Iframe / srcdoc ortamındaysa mevcut HTML içeriğini yeni sekmede ?pin= ile aç
          const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          const injectedHtml = htmlContent.replace(
            "this.prefillPin = '';",
            `this.role = 'PLAYER'; this.prefillPin = '${this.pin}';`
          );
          const blob = new Blob([injectedHtml], { type: 'text/html;charset=utf-8' });
          const blobUrl = URL.createObjectURL(blob);
          window.open(blobUrl, '_blank');
        }
        showToast("Oyuncu sekmesi açıldı! PIN otomatik dolduruldu.", "info");
      }

      async start() {
        await backend.init();
        backend.onUpdate((kind, pin, data) => {
          if (pin !== this.pin) return;
          if (kind === 'room' && data) {
            const prevStatus = this.room?.status;
            const prevQ = this.room?.currentQuestionIndex;
            this.room = data;

            // Durum değiştiyse zamanlayıcıyı ve ekranı güncelle
            if (prevStatus !== data.status || prevQ !== data.currentQuestionIndex) {
              this.handleStateTransition(data);
            }
            this.render();
          } else if (kind === 'players') {
            // Sadece dinamik sayaçları ve listeleri güncelle (tam render yerine akıcı güncelleme)
            this.updateLivePlayerElements();
          }
        });

        this.render();
      }

      resetToHome() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        if (this.unsubCloud) this.unsubCloud();
        this.role = null;
        this.pin = null;
        this.room = null;
        this.player = null;
        document.getElementById('home-btn').classList.add('hidden');
        this.render();
      }

      // Durum geçişlerinde ses ve sayaç yönetimi
      handleStateTransition(roomData) {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.lastTickSecond = null;

        if (roomData.status === 'QUESTION') {
          this.startCountdownLoop();
        } else if (roomData.status === 'QUESTION_RESULT') {
          if (this.role === 'PLAYER' && this.player) {
            // Oyuncunun son durumunu bellekten tazele
            const fresh = backend.getPlayersForRoom(this.pin).find(p => p.nickname === this.player.nickname);
            if (fresh) this.player = fresh;

            const isCorrect = this.player.lastQuestionIndex === roomData.currentQuestionIndex && this.player.lastPointsEarned > 0;
            if (isCorrect) soundEngine.correct();
            else soundEngine.wrong();
          }
        } else if (roomData.status === 'PODIUM') {
          soundEngine.fanfare();
        }
      }

      // Geri Sayım Döngüsü
      startCountdownLoop() {
        const updateTimer = () => {
          if (!this.room || this.room.status !== 'QUESTION') {
            clearInterval(this.timerInterval);
            return;
          }
          const q = this.room.questions[this.room.currentQuestionIndex];
          const elapsed = (Date.now() - this.room.questionStartTime) / 1000;
          const remaining = Math.max(0, Math.ceil(q.timeLimit - elapsed));

          const timerEl = document.getElementById('countdown-value');
          const barEl = document.getElementById('countdown-bar');
          if (timerEl) timerEl.textContent = remaining;
          if (barEl) {
            const pct = Math.max(0, Math.min(100, ((q.timeLimit - elapsed) / q.timeLimit) * 100));
            barEl.style.width = `${pct}%`;
          }

          if (remaining !== this.lastTickSecond && remaining > 0) {
            this.lastTickSecond = remaining;
            if (this.role === 'HOST') {
              soundEngine.tick(remaining <= 5);
            }
          }

          // Süre bittiğinde Host otomatik olarak sonuç ekranına geçer
          if (remaining <= 0 && this.role === 'HOST') {
            clearInterval(this.timerInterval);
            this.hostFinishQuestion();
          }
        };

        updateTimer();
        this.timerInterval = setInterval(updateTimer, 200);
      }

      // Dosya Yükleme ve Parse Etme (.xlsx, .csv, .json)
      handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();

        const processRows = (rows) => {
          const parsed = [];
          const letterMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, '1': 0, '2': 1, '3': 2, '4': 3 };

          rows.forEach((row, idx) => {
            const qText = row['Soru'] || row['soru'] || row['Question'] || row['question'];
            const optA = row['Seçenek A'] || row['A'] || row['optionA'];
            const optB = row['Seçenek B'] || row['B'] || row['optionB'];
            const optC = row['Seçenek C'] || row['C'] || row['optionC'];
            const optD = row['Seçenek D'] || row['D'] || row['optionD'];
            const ansRaw = String(row['Doğru Cevap'] || row['Dogru Cevap'] || row['Answer'] || 'A').trim().toUpperCase();
            const timeVal = parseInt(row['Süre'] || row['Sure'] || row['Time'] || 15, 10);

            if (qText && optA && optB) {
              parsed.push({
                id: `q_${Date.now()}_${idx}`,
                text: String(qText).trim(),
                options: [
                  String(optA).trim(),
                  String(optB).trim(),
                  String(optC || 'Seçenek C').trim(),
                  String(optD || 'Seçenek D').trim()
                ],
                correctIndex: letterMap[ansRaw] !== undefined ? letterMap[ansRaw] : 0,
                timeLimit: isNaN(timeVal) || timeVal < 5 ? 15 : Math.min(120, timeVal)
              });
            }
          });

          if (parsed.length > 0) {
            this.questions = parsed;
            showToast(`${parsed.length} soru başarıyla yüklendi!`, "success");
            this.render();
          } else {
            showToast("Dosyada geçerli soru formatı bulunamadı.", "error");
          }
        };

        if (ext === 'json') {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const json = JSON.parse(e.target.result);
              processRows(Array.isArray(json) ? json : json.questions || []);
            } catch (err) {
              showToast("JSON dosyası okunamadı.", "error");
            }
          };
          reader.readAsText(file);
        } else if (ext === 'csv') {
          Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => processRows(results.data),
            error: () => showToast("CSV dosyası ayrıştırılamadı.", "error")
          });
        } else if (ext === 'xlsx' || ext === 'xls') {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
              const rows = XLSX.utils.sheet_to_json(firstSheet);
              processRows(rows);
            } catch (err) {
              showToast("Excel dosyası okunamadı.", "error");
            }
          };
          reader.readAsArrayBuffer(file);
        } else {
          showToast("Desteklenmeyen dosya formatı (.xlsx, .csv, .json kullanın)", "error");
        }
      }

      addNewQuestion() {
        soundEngine.click();
        this.questions.push({
          id: `q_${Date.now()}`,
          text: "Yeni soru metnini buraya yazın...",
          options: ["Seçenek A", "Seçenek B", "Seçenek C", "Seçenek D"],
          correctIndex: 0,
          timeLimit: 15
        });
        this.editingQuestionIdx = this.questions.length - 1;
        this.render();
      }

      deleteQuestion(idx) {
        if (this.questions.length <= 1) {
          showToast("En az 1 soru bulunmalıdır.", "warning");
          return;
        }
        this.questions.splice(idx, 1);
        this.editingQuestionIdx = null;
        this.render();
      }

      saveEditedQuestion(idx) {
        const text = document.getElementById(`edit-q-text-${idx}`).value.trim();
        const opts = [0, 1, 2, 3].map(i => document.getElementById(`edit-q-opt-${idx}-${i}`).value.trim());
        const correctIndex = parseInt(document.getElementById(`edit-q-ans-${idx}`).value, 10);
        const timeLimit = parseInt(document.getElementById(`edit-q-time-${idx}`).value, 10) || 15;

        if (!text || opts.some(o => !o)) {
          showToast("Soru ve tüm seçenekler dolu olmalıdır.", "error");
          return;
        }
        this.questions[idx] = { ...this.questions[idx], text, options: opts, correctIndex, timeLimit };
        this.editingQuestionIdx = null;
        showToast("Soru güncellendi", "success");
        this.render();
      }

      // 6 Haneli PIN ile Odayı Başlat (Lobi)
      async createLobby() {
        if (this.questions.length === 0) {
          showToast("Lütfen önce en az 1 soru ekleyin.", "error");
          return;
        }
        soundEngine.click();
        const pin = String(Math.floor(100000 + Math.random() * 900000));

          status: 'LOBBY',
          currentQuestionIndex: 0,
          questionStartTime: null,
          questions: this.questions,
          createdAt: Date.now()
        };

        this.room = roomData;
        if (this.unsubCloud) this.unsubCloud();
        this.unsubCloud = backend.subscribeToRoom(pin);

      }

        };

      selectPlayerRole() {

      async joinRoom(event) {
        event.preventDefault();
        soundEngine.init();
        const pinInput = document.getElementById('join-pin').value.trim();
        const nickInput = document.getElementById('join-nick').value.trim();

        if (!/^\d{6}$/.test(pinInput)) {
          showToast("Lütfen 6 haneli geçerli bir Oyun PIN'i girin.", "error");
          return;
        }
        if (nickInput.length < 2 || nickInput.length > 18) {
          showToast("Takma ad 2 ile 18 karakter arasında olmalıdır.", "error");
          return;
        }

        const btn = document.getElementById('join-submit-btn');
        btn.disabled = true;
        btn.textContent = "Bağlanılıyor...";

        const room = await backend.getRoom(pinInput);
        if (!room) {
          showToast("Bu PIN koduna sahip aktif bir yarışma bulunamadı.", "error");
          btn.disabled = false;
          btn.textContent = "Oyuna Katıl";
          return;
        }

        // Aynı isimde oyuncu var mı kontrol et (Bağlantı kopması sonrası geri dönüş desteği)
        const existingPlayer = await backend.getPlayer(pinInput, nickInput);
        let playerObj;

        if (existingPlayer) {
          // Eğer oyuncu zaten varsa ve şu an aktif görünüyorsa uyar, ama kopmuşsa devam etmesine izin ver
          playerObj = await backend.savePlayer({
            ...existingPlayer,
            isOnline: true
          });
          showToast(`Tekrar hoş geldin ${playerObj.nickname}! Mevcut puanın (${playerObj.score}) korundu.`, "success");
        } else {
          playerObj = await backend.savePlayer({
            roomPin: pinInput,
            nickname: nickInput,
            score: 0,
            streak: 0,
            lastAnswerIndex: null,
            lastQuestionIndex: -1,
            lastPointsEarned: 0,
            isOnline: true
          });
          showToast("Odaya başarıyla katıldın!", "success");
        }

        this.pin = pinInput;
        this.room = room;
        this.player = playerObj;
        if (this.unsubCloud) this.unsubCloud();
        this.unsubCloud = backend.subscribeToRoom(pinInput);

        if (room.status === 'QUESTION') {
          this.startCountdownLoop();
        }
        this.render();
      }

      // Oyuncu Cevap Gönderme (Hız + Seri Bonusu Hesaplamalı)
      async submitAnswer(optionIndex) {
        if (!this.room || this.room.status !== 'QUESTION' || !this.player) return;
        const qIdx = this.room.currentQuestionIndex;
        // Zaten bu soruya cevap verdiyse kilitle
        if (this.player.lastQuestionIndex === qIdx) return;

        soundEngine.click();
        const question = this.room.questions[qIdx];
        const now = Date.now();
        const elapsedSec = Math.max(0, (now - this.room.questionStartTime) / 1000);
        const remainingSec = Math.max(0, question.timeLimit - elapsedSec);

        const isCorrect = optionIndex === question.correctIndex;
        let pointsEarned = 0;
        let newStreak = 0;

        if (isCorrect) {
          newStreak = (this.player.streak || 0) + 1;
          const basePoints = 500;
          const speedBonus = Math.round(500 * (remainingSec / question.timeLimit));
          const rawPoints = basePoints + speedBonus;
          // Üst üste 3+ doğru cevapta %20 seri çarpanı
          const streakMultiplier = newStreak >= 3 ? 1.2 : 1.0;
          pointsEarned = Math.round(rawPoints * streakMultiplier);
        } else {
          newStreak = 0;
          pointsEarned = 0;
        }

        const updatedPlayer = await backend.savePlayer({
          ...this.player,
          score: (this.player.score || 0) + pointsEarned,
          streak: newStreak,
          lastAnswerIndex: optionIndex,
          lastQuestionIndex: qIdx,
          lastPointsEarned: pointsEarned,
          lastAnswerTime: now
        });

        this.player = updatedPlayer;
        this.render();
      }

      // =======================================================================
      // CANLI DOM GÜNCELLEMELERİ (100+ Oyuncu Akıcılığı İçin)
      // =======================================================================
      updateLivePlayerElements() {
        if (!this.pin) return;
        const players = backend.getPlayersForRoom(this.pin);

        // Lobi Oyuncu Sayacı ve Grid Güncellemesi
        const lobbyCountEl = document.getElementById('lobby-player-count');
        const lobbyGridEl = document.getElementById('lobby-player-grid');
        if (lobbyCountEl) lobbyCountEl.textContent = players.length;
        if (lobbyGridEl) {
          if (players.length === 0) {
            lobbyGridEl.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Katılımcıların PIN kodu veya QR kod ile bağlanması bekleniyor...</div>`;
          } else {
            lobbyGridEl.innerHTML = players.map(p => `
              <div class="px-4 py-2.5 rounded-xl bg-white/10 border border-white/15 font-bold text-sm sm:text-base text-white flex items-center justify-between gap-2 animate-pop shadow-sm">
                <span class="truncate">${this.escapeHtml(p.nickname)}</span>
                <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
              </div>
            `).join('');
          }
        }

        // Soru Ekranı Canlı Cevap Sayacı
        const ansCountEl = document.getElementById('live-answer-count');
        const totalPlayersEl = document.getElementById('live-total-players');
        if (ansCountEl && this.room) {
          const qIdx = this.room.currentQuestionIndex;
          const answeredCount = players.filter(p => p.lastQuestionIndex === qIdx).length;
          ansCountEl.textContent = answeredCount;
          if (totalPlayersEl) totalPlayersEl.textContent = players.length;

          // Tüm oyuncular cevapladıysa Host otomatik olarak soruyu bitirebilir
          if (this.role === 'HOST' && this.room.status === 'QUESTION' && players.length > 0 && answeredCount >= players.length) {
            setTimeout(() => this.hostFinishQuestion(), 600);
          }
        }
      }

      escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      }

      copyRoomLink() {
        const isSandbox = !window.location.href || window.location.href.startsWith('about:') || window.location.href.startsWith('blob:');
        const textToCopy = isSandbox
          ? `QuizArena Canlı Bilgi Yarışması | Oyun PIN Kodu: ${this.pin}`
          : this.getJoinUrl();

        const tempInput = document.createElement('input');
        tempInput.value = textToCopy;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(isSandbox ? `Oyun PIN Kodu (${this.pin}) kopyalandı!` : "Katılım bağlantısı panoya kopyalandı!", "success");
      }

      // =======================================================================
      // EKRAN RENDER MOTORU
      // =======================================================================
      render() {
        const root = document.getElementById('app-root');
        if (!root) return;

        if (!this.role) {
          root.innerHTML = this.renderLanding();
        } else if (this.role === 'HOST') {
          if (!this.room) {
            root.innerHTML = this.renderHostSetup();
          } else if (this.room.status === 'LOBBY') {
            root.innerHTML = this.renderHostLobby();
            this.generateQRCode();
            this.updateLivePlayerElements();
          } else if (this.room.status === 'QUESTION') {
            root.innerHTML = this.renderHostQuestion();
            this.updateLivePlayerElements();
          } else if (this.room.status === 'QUESTION_RESULT') {
            root.innerHTML = this.renderHostQuestionResult();
          } else if (this.room.status === 'LEADERBOARD') {
            root.innerHTML = this.renderHostLeaderboard();
          } else if (this.room.status === 'PODIUM') {
            root.innerHTML = this.renderPodium();
          }
        } else if (this.role === 'PLAYER') {
          if (!this.player || !this.room) {
            root.innerHTML = this.renderPlayerJoin();
          } else if (this.room.status === 'LOBBY') {
            root.innerHTML = this.renderPlayerLobby();
          } else if (this.room.status === 'QUESTION') {
            root.innerHTML = this.renderPlayerGamePad();
          } else if (this.room.status === 'QUESTION_RESULT' || this.room.status === 'LEADERBOARD') {
            root.innerHTML = this.renderPlayerFeedback();
          } else if (this.room.status === 'PODIUM') {
            root.innerHTML = this.renderPodium(true);
          }
        }

        lucide.createIcons();
      }

              <div class="lg:col-span-7 flex flex-col items-center lg:items-start text-center lg:text-left">

                    ${this.pin}
                  </div>
                  <button onclick="app.copyRoomLink()" class="px-4 py-3.5 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/15 text-white font-bold text-xs flex items-center gap-2 transition cursor-pointer" title="PIN / Link Kopyala">
                    <i data-lucide="copy" class="w-5 h-5 text-indigo-300"></i>
                    <span>${isSandbox ? 'PIN Kopyala' : 'Linki Kopyala'}</span>
                  </button>
                  <button onclick="app.openTestPlayerTab()" class="px-4 py-3.5 rounded-2xl bg-fuchsia-600/25 hover:bg-fuchsia-600/40 border border-fuchsia-400/40 text-fuchsia-200 font-bold text-xs flex items-center gap-2 transition cursor-pointer">
                    <i data-lucide="external-link" class="w-5 h-5"></i>

              <!-- QR Kod Alanı -->
              <div class="lg:col-span-5 flex flex-col sm:flex-row items-center justify-center lg:justify-end gap-5">
                <a href="${displayUrl}" target="_blank" onclick="if(${isSandbox}){ event.preventDefault(); app.openTestPlayerTab(); }" class="bg-white p-3 rounded-2xl shadow-xl hover:scale-105 transition cursor-pointer block" title="QR Kodu Okutun veya Tıklayın">
                  <div id="qrcode-box" class="w-[128px] h-[128px] flex items-center justify-center"></div>
                </a>
                <div class="text-center sm:text-left">
                  <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-300 text-xs font-bold mb-2">
                    <i data-lucide="qr-code" class="w-4 h-4"></i> Hızlı Katılım QR
                  </div>
                  <p class="text-[11px] text-slate-300 max-w-[210px] leading-relaxed">
                    ${isSandbox
                      ? '<strong class="text-amber-400">⚠️ Önizleme Modu:</strong> Başka bir cihazdan (telefondan) odayı bulabilmek için oyunu bir web sunucusuna yüklemelisiniz. Şimdilik test için <strong>"Oyuncu Sekmesi Aç"</strong> butonunu kullanın.'
                      : 'Telefon kameranızla QR kodu okutarak veya üzerine tıklayarak doğrudan giriş yapın.'}
                  </p>
                </div>
              </div>
            </div>

            <!-- Orta Alan: Canlı Katılımcı Listesi -->
            <div class="flex-1 bg-slate-900/60 border border-white/10 rounded-3xl p-6 flex flex-col">
              <div class="flex flex-wrap items-center justify-between gap-4 mb-5">
                <div class="flex items-center gap-3">
                  <div class="px-4 py-2 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center gap-2">
                    <i data-lucide="users" class="w-5 h-5 text-indigo-400"></i>
                    <span id="lobby-player-count" class="text-2xl font-black text-white">0</span>
                    <span class="text-xs font-bold text-indigo-300 uppercase">Katılımcı</span>
                  </div>
                  <span class="text-xs text-slate-400 hidden sm:inline">Maksimum kapasite: 100+ eşzamanlı oyuncu</span>
                </div>

                <button onclick="app.hostStartQuestion(0)" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-display font-black text-lg shadow-xl shadow-emerald-500/25 flex items-center gap-2 transition active:scale-95 cursor-pointer">
                  <i data-lucide="play" class="w-6 h-6 fill-slate-950"></i> Yarışmayı Başlat (${this.room.questions.length} Soru)
                </button>
              </div>

              <div id="lobby-player-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 overflow-y-auto max-h-[42vh] pr-1">

              </div>
            </div>

      }

      generateQRCode() {
        const box = document.getElementById('qrcode-box');
        if (!box) return;
        box.innerHTML = '';
        const joinUrl = this.getJoinUrl();
        try {
          if (typeof QRCode !== 'undefined') {
            new QRCode(box, {
              text: joinUrl,
              width: 128,
              height: 128,
              colorDark: "#0f172a",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.L
            });
          } else {
            throw new Error("QRCode kütüphanesi yüklenemedi");
          }
        } catch (err) {
          // Kütüphane yüklenemezse yedek QR API görseli göster
          box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=128x128&data=${encodeURIComponent(joinUrl)}" alt="Oyun QR Kodu" class="w-32 h-32 rounded-lg" />`;
        }
      }

      // 4. HOST: CANLI SORU EKRANI
      renderHostQuestion() {
        const qIdx = this.room.currentQuestionIndex;
        const q = this.room.questions[qIdx];
        const totalQ = this.room.questions.length;

        return `
          <div class="flex-1 flex flex-col justify-between gap-6 animate-pop">

              <div class="flex items-center justify-between">

              </div>

              </div>

            <!-- Soru Metni ve Sayaçlar -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center my-auto">

              <div class="lg:col-span-2 flex justify-center">
                <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-indigo-600/20 border-4 border-indigo-500 flex flex-col items-center justify-center animate-pulse-ring">
                  <span id="countdown-value" class="font-display text-4xl sm:text-5xl font-black text-white">${q.timeLimit}</span>

                </div>
              </div>

              <!-- Soru Kutusu -->

                <h2 class="font-display text-2xl sm:text-4xl font-extrabold text-white leading-snug">

                  </div>
                  <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mt-1">Cevap</div>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${q.options.map((opt, idx) => {
                const st = OPTION_STYLES[idx];
                return `
                  <div class="${st.bg} border-2 ${st.border} rounded-2xl p-5 sm:p-6 flex items-center gap-4 shadow-xl">
                    <div class="w-12 h-12 rounded-xl bg-black/20 flex items-center justify-center shrink-0">
                      ${st.svg}
                    </div>
                    <span class="text-lg sm:text-2xl font-extrabold leading-tight">${this.escapeHtml(opt)}</span>

              }).join('')}

          </div>
        `;
      }

      // 5. HOST: SORU SONUCU & ŞIK DAĞILIMI (BAR CHART)
      renderHostQuestionResult() {
        const qIdx = this.room.currentQuestionIndex;
        const q = this.room.questions[qIdx];
        const isLastQuestion = qIdx >= this.room.questions.length - 1;
        const players = backend.getPlayersForRoom(this.pin);

        // Her şıkkı seçen oyuncu sayısını hesapla
        const counts = [0, 0, 0, 0];
        players.forEach(p => {
          if (p.lastQuestionIndex === qIdx && p.lastAnswerIndex >= 0 && p.lastAnswerIndex <= 3) {
            counts[p.lastAnswerIndex]++;
          }
        });
        const maxCount = Math.max(1, ...counts);

        return `
          <div class="flex-1 flex flex-col justify-between gap-6 animate-pop">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900/80 border border-white/10 rounded-3xl p-6">
              <div>
                <span class="text-xs font-extrabold uppercase text-emerald-400">Süre Doldu • Soru ${qIdx + 1} Sonuçları</span>
                <h2 class="text-xl sm:text-2xl font-extrabold text-white mt-1">${this.escapeHtml(q.text)}</h2>
              </div>
              <button onclick="${isLastQuestion ? 'app.hostShowPodium()' : 'app.hostShowLeaderboard()'}" class="px-6 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-base shadow-lg shadow-indigo-600/30 flex items-center gap-2 shrink-0 transition">
                ${isLastQuestion ? 'Final Podyumunu Göster 🏆' : 'Liderlik Tablosunu Göster'} <i data-lucide="arrow-right" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- Bar Chart (Şık Dağılımı) -->
            <div class="bg-slate-900/70 border border-white/10 rounded-3xl p-6 sm:p-10 flex flex-col justify-end">
              <div class="grid grid-cols-4 gap-4 sm:gap-8 items-end h-64 pt-8 border-b border-white/15 pb-4">
                ${[0, 1, 2, 3].map(idx => {
                  const st = OPTION_STYLES[idx];
                  const isCorrect = q.correctIndex === idx;
                  const heightPct = Math.max(12, Math.round((counts[idx] / maxCount) * 100));
                  return `
                    <div class="flex flex-col items-center h-full justify-end">
                      <div class="flex items-center gap-1.5 mb-2 font-black text-lg sm:text-2xl ${isCorrect ? 'text-emerald-400' : 'text-slate-300'}">
                        ${counts[idx]}
                        ${isCorrect ? '<i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-400"></i>' : ''}
                      </div>
                      <div class="w-full max-w-[110px] ${st.bar} rounded-t-2xl transition-all duration-700 shadow-lg ${isCorrect ? 'ring-4 ring-emerald-400' : 'opacity-65'}" style="height: ${heightPct}%"></div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Alt Şık İsimleri ve Doğru Cevap Vurgusu -->
              <div class="grid grid-cols-4 gap-4 sm:gap-8 pt-4">
                ${q.options.map((opt, idx) => {
                  const st = OPTION_STYLES[idx];
                  const isCorrect = q.correctIndex === idx;
                  return `
                    <div class="p-3 rounded-xl border text-center ${isCorrect ? 'bg-emerald-500/20 border-emerald-400 text-white font-extrabold' : 'bg-white/5 border-white/10 text-slate-400 opacity-65'}">
                      <div class="flex justify-center mb-1 scale-75">${st.svg}</div>
                      <div class="text-xs sm:text-sm truncate">${this.escapeHtml(opt)}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      // 6. HOST: ARA LİDERLİK TABLOSU (İLK 5 OYUNCU)

        const players = backend.getPlayersForRoom(this.pin).slice(0, 5);

        return `

                </div>

                  <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Liderlik Tablosu</h2>
                  <p class="text-xs text-slate-400">İlk 5 Yarışmacı</p>
                </div>
              </div>
              <button onclick="app.hostStartQuestion(${nextQIdx})" class="px-6 py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 to-fuchsia-600 hover:from-indigo-500 hover:to-fuchsia-500 text-white font-extrabold shadow-lg flex items-center gap-2 transition active:scale-95">

            <div class="space-y-3">
              ${players.length === 0 ? `<div class="text-center py-10 text-slate-400">Henüz puan kazanan oyuncu yok.</div>` : players.map((p, idx) => `
                <div class="p-4 sm:p-5 rounded-2xl border flex items-center justify-between gap-4 transition ${idx === 0 ? 'bg-gradient-to-r from-amber-500/25 to-slate-900 border-amber-400/60 scale-[1.02]' : 'bg-slate-900/80 border-white/10'}">
                  <div class="flex items-center gap-4">
                    <span class="w-9 h-9 rounded-xl flex items-center justify-center font-black text-base ${idx === 0 ? 'bg-amber-400 text-slate-950' : 'bg-white/10 text-white'}">
                      ${idx + 1}
                    </span>
                    <div>
                      <div class="font-extrabold text-lg text-white flex items-center gap-2">
                        ${this.escapeHtml(p.nickname)}
                        ${p.streak >= 3 ? `<span class="text-xs px-2 py-0.5 rounded-full bg-orange-500/20 text-orange-300 border border-orange-500/40">🔥 ${p.streak} Seri</span>` : ''}
                      </div>
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="font-display text-xl sm:text-2xl font-black text-white">${p.score}</div>
                    ${p.lastPointsEarned > 0 ? `<div class="text-xs font-bold text-emerald-400">+${p.lastPointsEarned}</div>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 7. FİNAL PODYUMU (İLK 3 OYUNCU)
      renderPodium(isPlayerView = false) {
        const allPlayers = backend.getPlayersForRoom(this.pin);
        const top3 = allPlayers.slice(0, 3);
        const myRank = isPlayerView && this.player ? allPlayers.findIndex(p => p.nickname === this.player.nickname) + 1 : null;

        return `
          <div class="flex-1 flex flex-col items-center justify-center text-center py-6 animate-pop">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 text-xs font-extrabold uppercase tracking-wider mb-3">
              🏆 Yarışma Tamamlandı
            </div>
            <h1 class="font-display text-3xl sm:text-5xl font-black text-white mb-8">Şampiyonlar Podyumu</h1>

            ${myRank ? `
              <div class="mb-8 px-6 py-3 rounded-2xl bg-indigo-600/25 border border-indigo-400/40 text-indigo-100 font-bold">
                Senin Final Sıralaman: <span class="text-2xl font-black text-white mx-1">#${myRank}</span> (${this.player.score} Puan)
              </div>
            ` : ''}

            <!-- Podyum Sütunları (2. - 1. - 3.) -->
            <div class="grid grid-cols-3 gap-3 sm:gap-6 items-end max-w-2xl w-full h-72 px-2">
              <!-- 2. Sıra -->
              <div class="flex flex-col items-center">
                ${top3[1] ? `
                  <div class="font-extrabold text-sm sm:text-lg text-white truncate max-w-full mb-1">${this.escapeHtml(top3[1].nickname)}</div>
                  <div class="text-xs font-bold text-slate-300 mb-2">${top3[1].score} puan</div>
                ` : '<div class="text-xs text-slate-500 mb-2">-</div>'}
                <div class="w-full h-36 rounded-t-2xl bg-gradient-to-t from-slate-700 to-slate-500 border-t-4 border-slate-300 flex flex-col items-center justify-center shadow-xl">
                  <span class="font-display text-4xl font-black text-white">2</span>
                </div>
              </div>

              <!-- 1. Sıra (Şampiyon) -->
              <div class="flex flex-col items-center">
                <i data-lucide="crown" class="w-10 h-10 text-amber-400 fill-amber-400 mb-1 animate-bounce"></i>
                ${top3[0] ? `
                  <div class="font-black text-base sm:text-xl text-amber-300 truncate max-w-full mb-1">${this.escapeHtml(top3[0].nickname)}</div>
                  <div class="text-xs sm:text-sm font-extrabold text-white mb-2">${top3[0].score} puan</div>
                ` : '<div class="text-xs text-slate-500 mb-2">-</div>'}
                <div class="w-full h-48 rounded-t-2xl bg-gradient-to-t from-amber-600 to-amber-400 border-t-4 border-amber-200 flex flex-col items-center justify-center shadow-2xl shadow-amber-500/30">
                  <span class="font-display text-5xl font-black text-slate-950">1</span>
                </div>
              </div>

              <!-- 3. Sıra -->
              <div class="flex flex-col items-center">
                ${top3[2] ? `
                  <div class="font-extrabold text-sm sm:text-lg text-white truncate max-w-full mb-1">${this.escapeHtml(top3[2].nickname)}</div>
                  <div class="text-xs font-bold text-slate-300 mb-2">${top3[2].score} puan</div>
                ` : '<div class="text-xs text-slate-500 mb-2">-</div>'}
                <div class="w-full h-28 rounded-t-2xl bg-gradient-to-t from-amber-900 to-amber-700 border-t-4 border-amber-500 flex flex-col items-center justify-center shadow-xl">
                  <span class="font-display text-4xl font-black text-white">3</span>
                </div>
              </div>
            </div>

            <button onclick="app.resetToHome()" class="mt-10 px-8 py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 font-bold text-white transition">
              Ana Ekrana Dön
            </button>
          </div>
        `;
      }

      // =======================================================================
      // KATILIMCI (OYUNCU) EKRANLARI (MOBİL ÖNCELİKLİ)
      // =======================================================================
      renderPlayerJoin() {
        return `
          <div class="flex-1 flex flex-col items-center justify-center py-6 animate-pop">
            <div class="w-full max-w-md bg-slate-900/90 border-2 border-white/15 rounded-3xl p-6 sm:p-8 shadow-2xl">
              <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-2xl bg-fuchsia-500/20 border border-fuchsia-400/30 flex items-center justify-center mx-auto mb-4">
                  <i data-lucide="gamepad-2" class="w-8 h-8 text-fuchsia-400"></i>
                </div>
                <h1 class="font-display text-2xl sm:text-3xl font-black text-white">Yarışmaya Katıl</h1>
                <p class="text-slate-400 text-sm mt-1">Ekrandaki 6 haneli PIN kodunu ve takma adını gir.</p>
              </div>

              <form onsubmit="app.joinRoom(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Oyun PIN Kodu</label>
                  <input id="join-pin" type="text" inputmode="numeric" maxlength="6" value="${this.prefillPin || ''}" required placeholder="Örn: 482910" class="w-full px-4 py-4 rounded-2xl bg-slate-950 border-2 border-white/15 focus:border-fuchsia-500 text-center font-display text-2xl font-black tracking-widest text-white focus:outline-none" />
                </div>

                <div>
                  <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Takma Ad (Nickname)</label>
                  <input id="join-nick" type="text" maxlength="18" required placeholder="Takma adın..." class="w-full px-4 py-4 rounded-2xl bg-slate-950 border-2 border-white/15 focus:border-fuchsia-500 text-center text-lg font-bold text-white focus:outline-none" />
                </div>

                <button id="join-submit-btn" type="submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-fuchsia-600 to-indigo-600 hover:from-fuchsia-500 hover:to-indigo-500 text-white font-display font-extrabold text-lg shadow-xl shadow-fuchsia-600/30 transition active:scale-95">
                  Oyuna Katıl
                </button>
              </form>
            </div>
          </div>
        `;
      }

      renderPlayerLobby() {
        return `
          <div class="flex-1 flex flex-col items-center justify-center text-center p-4 animate-pop">
            <div class="w-20 h-20 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center mb-6 animate-pulse">
              <i data-lucide="check" class="w-10 h-10 text-emerald-400"></i>
            </div>
            <span class="px-4 py-1 rounded-full bg-white/10 text-xs font-bold text-indigo-300 mb-3">Oda PIN: ${this.pin}</span>
            <h1 class="font-display text-3xl sm:text-4xl font-black text-white mb-2">İçeridesin, ${this.escapeHtml(this.player.nickname)}!</h1>
            <p class="text-slate-300 text-base max-w-md">
              Adını sunucu ekranında görebiliyor musun? Diğer oyuncular bekleniyor, yarışma birazdan başlayacak...
            </p>
          </div>
        `;
      }

      renderPlayerGamePad() {
        const qIdx = this.room.currentQuestionIndex;
        const q = this.room.questions[qIdx];
        const hasAnswered = this.player.lastQuestionIndex === qIdx;

        if (hasAnswered) {
          return `
            <div class="flex-1 flex flex-col items-center justify-center text-center p-6 animate-pop">
              <div class="w-20 h-20 rounded-3xl bg-indigo-500/20 border border-indigo-400/40 flex items-center justify-center mb-6">
                <i data-lucide="hourglass" class="w-10 h-10 text-indigo-400 animate-spin"></i>
              </div>
              <h2 class="font-display text-2xl sm:text-3xl font-extrabold text-white mb-2">Cevabın Alındı!</h2>
              <p class="text-slate-400 text-base">Süre bitimi ve diğer yarışmacılar bekleniyor...</p>
            </div>
          `;
        }

        return `
          <div class="flex-1 flex flex-col justify-between gap-4 animate-pop">
            <!-- Üst Bilgi Barı -->
            <div class="flex items-center justify-between bg-slate-900/90 border border-white/10 px-4 py-3 rounded-2xl">
              <span class="text-xs font-extrabold text-indigo-300">Soru ${qIdx + 1} / ${this.room.questions.length}</span>
              <div class="flex items-center gap-2">
                <button onclick="app.showOptionsOnPhone = !app.showOptionsOnPhone; app.render();" class="text-xs px-2.5 py-1 rounded-lg bg-white/10 text-slate-300 font-semibold">
                  ${this.showOptionsOnPhone ? 'Metni Gizle' : 'Metni Göster'}
                </button>
                <span class="px-3 py-1 rounded-lg bg-rose-500/20 text-rose-300 font-black text-sm">
                  <span id="countdown-value">${q.timeLimit}</span>s
                </span>
              </div>
            </div>

            ${this.showOptionsOnPhone ? `
              <div class="bg-slate-900/70 border border-white/10 p-4 rounded-2xl text-center">
                <p class="font-bold text-sm sm:text-base text-white">${this.escapeHtml(q.text)}</p>
              </div>
            ` : ''}

            <!-- 4 Büyük Renk Körü Dostu Cevap Butonu -->
            <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4 min-h-[55vh]">
              ${q.options.map((opt, idx) => {
                const st = OPTION_STYLES[idx];
                return `
                  <button onclick="app.submitAnswer(${idx})" class="${st.bg} border-b-8 border-black/30 rounded-3xl p-6 flex flex-col sm:flex-row items-center justify-center gap-4 shadow-2xl transition-transform active:scale-95">
                    <div class="w-16 h-16 rounded-2xl bg-black/20 flex items-center justify-center shrink-0">
                      ${st.svg}
                    </div>
                    ${this.showOptionsOnPhone ? `<span class="text-lg sm:text-xl font-black text-center sm:text-left leading-snug">${this.escapeHtml(opt)}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Alt Skor Durumu -->
            <div class="flex items-center justify-between px-4 py-3 rounded-2xl bg-slate-950/80 border border-white/10 text-sm">
              <span class="font-bold text-slate-300">${this.escapeHtml(this.player.nickname)}</span>
              <span class="font-black text-white px-3 py-1 rounded-lg bg-white/10">${this.player.score} Puan</span>
            </div>
          </div>
        `;
      }

      renderPlayerFeedback() {
        const allPlayers = backend.getPlayersForRoom(this.pin);
        const freshMe = allPlayers.find(p => p.nickname === this.player.nickname) || this.player;
        this.player = freshMe;

        const qIdx = this.room.currentQuestionIndex;
        const answeredThis = freshMe.lastQuestionIndex === qIdx;
        const isCorrect = answeredThis && freshMe.lastPointsEarned > 0;
        const rank = allPlayers.findIndex(p => p.nickname === freshMe.nickname) + 1;

        return `
          <div class="flex-1 flex flex-col items-center justify-center text-center p-6 rounded-3xl border-2 animate-pop ${isCorrect ? 'bg-emerald-950/60 border-emerald-500/50' : 'bg-rose-950/60 border-rose-500/50'}">
            <div class="w-24 h-24 rounded-full flex items-center justify-center mb-6 shadow-2xl ${isCorrect ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white'}">
              <i data-lucide="${isCorrect ? 'check' : 'x'}" class="w-14 h-14 stroke-[3]"></i>
            </div>

            <h1 class="font-display text-4xl sm:text-5xl font-black text-white mb-2">
              ${isCorrect ? 'Doğru!' : (answeredThis ? 'Yanlış!' : 'Süre Doldu!')}
            </h1>

            ${isCorrect ? `
              <div class="px-6 py-2 rounded-2xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-display text-2xl font-black mb-4">
                +${freshMe.lastPointsEarned} Puan
              </div>
              ${freshMe.streak >= 3 ? `
                <div class="mb-4 px-4 py-1.5 rounded-full bg-orange-500/25 border border-orange-400/50 text-orange-200 text-sm font-extrabold">
                  🔥 ${freshMe.streak} Doğru Seri Bonusu (1.2x)!
                </div>
              ` : ''}
            ` : `
              <p class="text-rose-200 text-base mb-4">Bir sonraki soruda hızını konuştur!</p>
            `}

            <div class="mt-4 p-5 rounded-2xl bg-slate-950/80 border border-white/10 w-full max-w-xs space-y-2">
              <div class="flex justify-between text-sm">
                <span class="text-slate-400">Toplam Puanın:</span>
                <span class="font-black text-white">${freshMe.score}</span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-slate-400">Güncel Sıralaman:</span>
                <span class="font-black text-amber-400">#${rank > 0 ? rank : '-'} / ${allPlayers.length}</span>
              </div>
            </div>
          </div>
        `;
      }
    }

    window.app = new QuizApp();
    window.onload = () => window.app.start();
  </script>
</body>
</html>
